name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android CLI and Lightbuild
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://dl.google.com/android/cli/latest/linux_x86_64/android-cli -o "$HOME/.local/bin/android"
          chmod +x "$HOME/.local/bin/android"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Install Lightbuild distribution pinned in project.lightbuild.yaml
          "$HOME/.local/bin/android" sdk install build/lightbuild/0.0.30
          bash "$ANDROID_HOME/build/lightbuild/0.0.30/cli/install.sh"

      - name: Build Debug APK
        run: |
          lightbuild --plain build app:app-debug.apk

      - name: Update latest-release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-release
          git push -f origin latest-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-release
          name: Latest Release
          body: |
            Automated release build.
            Triggered from commit: ${{ github.sha }}
          files: app/build/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
